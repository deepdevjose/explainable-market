name: Validate foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        env:
          DATABASE_PATH: /tmp/market-ci.db
          DEEPSEEK_API_KEY: ''
      - run: ruff check .
      - run: mypy
      - run: bandit -q -r market_explained ai.py charts.py collector.py config.py db.py -ll
      - run: pip-audit -r requirements.txt
      - run: python scripts/check_repository_hygiene.py
      - run: node --check static/app.js
      - run: python -m compileall -q market_explained app.py ai.py charts.py collector.py config.py db.py
  forecasting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-ml.txt
      - run: python -m unittest discover -s tests -v
        env:
          DATABASE_PATH: /tmp/market-forecast-ci.db
          TWELVE_DATA_API_KEY: ''
          DEEPSEEK_API_KEY: ''
      - run: pip-audit -r requirements.txt -r requirements-ml.txt
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: docker compose -f infrastructure/deployment/compose.production.yaml config --quiet
        env:
          PUBLIC_HOST: market.example.test
          SECRET_KEY: ci-only-placeholder-not-a-production-secret
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
